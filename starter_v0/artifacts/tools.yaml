tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (mã asset_id, mã employee_id), khi môi trường chưa rõ (hỏi production hay staging), hoặc xin xác nhận trước khi thực hiện hành động ghi (như tạo ticket)."
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi gửi tới người dùng để làm rõ hoặc xin xác nhận."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "Kiểu trả lời mong đợi: 'text' khi cần nhập mã ID; 'yes_no' khi cần xác nhận action; 'choice' khi cần chọn từ danh sách."
        options:
          type: array
          default: []
          items:
            type: string
          description: "Danh sách các lựa chọn nếu response_type là 'choice'."
      required: [question]

  - name: search_kb
    description: "Tìm kiếm bài viết hướng dẫn xử lý sự cố trong Knowledge Base nội bộ theo từ khóa và chuyên mục. Không dùng để kiểm tra trạng thái thời gian thực của dịch vụ."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa hoặc câu hỏi cần tìm hướng dẫn."
        category:
          type: string
          enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room]
          default: "all"
          description: "Nhóm chuyên mục hướng dẫn kỹ thuật."
        top_k:
          type: integer
          default: 3
          description: "Số lượng bài viết kết quả tối đa."
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành của các dịch vụ dùng chung trong toàn công ty (vpn, email, sso, wifi, printing). Không dùng cho thiết bị cá nhân cụ thể."
    parameters:
      type: object
      properties:
        service:
          type: string
          enum: [vpn, email, sso, wifi, printing]
          description: "Tên dịch vụ dùng chung cần kiểm tra."
        environment:
          type: string
          enum: [production, staging]
          default: "production"
          description: "Môi trường triển khai: 'production' hoặc 'staging'."
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và diagnostic snapshot của một thiết bị cụ thể theo mã tài sản (asset_id). Yêu cầu mã tài sản hợp lệ (ví dụ: LT-204, DT-031)."
    parameters:
      type: object
      properties:
        asset_id:
          type: string
          description: "Mã tài sản của thiết bị cần kiểm tra (ví dụ: LT-204, DT-031, LT-318)."
        check:
          type: string
          enum: [all, network, vpn, security, hardware, software]
          default: "all"
          description: "Nhóm kiểm tra chẩn đoán cần thực hiện."
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên trong danh bạ hỗ trợ IT nội bộ theo mã nhân viên (employee_id) để xem thông tin cá nhân, phòng ban và các thiết bị được cấp."
    parameters:
      type: object
      properties:
        employee_id:
          type: string
          description: "Mã nhân viên cần tra cứu (ví dụ: EMP-1001, EMP-1003)."
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng và tổng hợp các phát hiện/findings đã thu thập thành một báo cáo sự cố có cấu trúc. Sử dụng khi đã có đầy đủ findings mà không cần thu thập lại dữ liệu."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các kết quả/chẩn đoán đã thu thập được."
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template:
          type: string
          enum: [brief, technical, handoff]
          default: "brief"
          description: "Mẫu định dạng báo cáo: tóm tắt, kỹ thuật hoặc bàn giao."
        incident_title:
          type: string
          default: "IT incident"
          description: "Tiêu đề của báo cáo sự cố."
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web qua Tavily. Chỉ được truyền hãng và tên model công khai; tuyệt đối không truyền asset_id, employee_id hay dữ liệu nội bộ. Nếu chuỗi model có chứa mã nội bộ (ví dụ LT-xxx, EMP-xxx) hoặc yêu cầu giữ nguyên mã nội bộ, KHÔNG gọi tool này mà phải gọi clarify(response_type='text') để yêu cầu người dùng bỏ mã nội bộ."
    parameters:
      type: object
      properties:
        manufacturer:
          type: string
          description: "Hãng sản xuất công khai (ví dụ: Lenovo, Dell, Apple)."
        model:
          type: string
          description: "Tên model thương mại công khai (ví dụ: ThinkPad T14 Gen 4, MacBook Pro 14)."
        query_type:
          type: string
          enum: [specs, drivers, support, compatibility]
          default: "support"
          description: "Loại thông tin công khai cần tìm kiếm."
        max_results:
          type: integer
          default: 3
          description: "Số kết quả tìm kiếm tối đa (tối đa 5)."
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm kiếm trong tài liệu chính sách và quy định IT nội bộ của công ty theo từ khóa và lĩnh vực quản lý chính sách."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Nội dung hoặc câu hỏi về chính sách cần tìm."
        policy_area:
          type: string
          enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing]
          default: "all"
          description: "Lĩnh vực chính sách: 'incident_response' cho phân loại mức độ ưu tiên sự cố (incident priority mapping: critical, high, medium, low) và xử lý sự cố; 'ticketing' cho quy định tạo vé và phê duyệt; 'access_control' cho quyền truy cập và xác thực; 'data_privacy' cho bảo mật dữ liệu; 'external_tools' cho công cụ ngoài."

        top_k:
          type: integer
          default: 3
          description: "Số điều khoản hoặc đoạn chính sách trả về."
      required: [query]

  - name: create_ticket
    description: "Tạo ticket sự cố kỹ thuật mới vào hệ thống. Là hành động ghi làm thay đổi trạng thái, BẮT BUỘC chỉ được gọi khi confirmed=true và người dùng đã đồng ý xác nhận tạo. Tuyệt đối không chấp nhận ghi mật khẩu, OTP hay mã khóa bí mật vào ticket; nếu yêu cầu ghi mật khẩu, từ chối mà không gọi tool nào."
    parameters:
      type: object
      properties:
        summary:
          type: string
          default: ""
          description: "Tóm tắt ngắn gọn nội dung sự cố (không chứa mật khẩu hoặc mã bảo mật)."
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: "medium"
          description: "Mức độ ưu tiên của ticket."
        asset_id:
          type: string
          default: ""
          description: "Mã tài sản liên quan đến sự cố nếu có."
        confirmed:
          type: boolean
          default: false
          description: "Đặt true KHI VÀ CHỈ KHI người dùng đã xác nhận rõ ràng đồng ý tạo ticket."
      required: [summary]
